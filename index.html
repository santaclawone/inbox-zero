<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Inbox Zero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
          sans-serif;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }

      /* ─── Layout ─── */
      .layout {
        display: grid;
        grid-template-columns: 380px auto;
        grid-template-rows: 64px auto;
        height: 100vh;
        transition: grid-template-columns 0.25s;
      }
      .layout.thread-open {
        grid-template-columns: 0px auto;
      }

      /* ─── Header ─── */
      .header {
        grid-column: 1/-1;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        font-size: 14px;
        z-index: 10;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .header-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      .header-logo svg {
        width: 20px;
        height: 20px;
      }
      .header-nav {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }
      .header-nav span {
        cursor: pointer;
        padding: 4px 0;
        transition: 0.15s;
      }
      .header-nav span:hover,
      .header-nav span.active {
        color: #fff;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #444;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #fff;
        font-weight: 600;
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .status-badge {
        background: rgba(255, 255, 255, 0.12);
        font-size: 10px;
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      /* ─── Sidebar ─── */
      .sidebar {
        background: #f6f6f6;
        padding: 24px 20px 16px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .sidebar-scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .sidebar-count {
        font-size: 12px;
        color: #888;
        margin-bottom: 1px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .sidebar-unread {
        font-size: 36px;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 20px;
      }
      .sidebar-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: 0.15s;
        text-decoration: none;
        font-family: inherit;
      }
      .btn-primary {
        background: #0066ff;
        color: #fff;
      }
      .btn-primary:hover {
        background: #0052cc;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn-secondary {
        background: transparent;
        color: #333;
        border: 1px solid #ddd;
      }
      .btn-secondary:hover {
        background: #eee;
      }
      .search-wrap {
        position: relative;
        margin-bottom: 8px;
      }
      .search-wrap input {
        width: 100%;
        padding: 9px 12px 9px 34px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        background: #fff;
        transition: 0.15s;
      }
      .search-wrap input:focus {
        border-color: #0066ff;
        box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.1);
      }
      .search-wrap .si {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        font-size: 13px;
        pointer-events: none;
      }
      .sidebar-categories {
        margin-top: 12px;
      }
      .sidebar-cat {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: 0.1s;
        color: #555;
        text-decoration: none;
        font-weight: 500;
      }
      .sidebar-cat:hover {
        background: rgba(0, 0, 0, 0.05);
        color: #1a1a1a;
      }
      .sidebar-cat.active {
        background: rgba(0, 102, 255, 0.08);
        color: #0066ff;
        font-weight: 600;
      }
      .sidebar-cat .count {
        margin-left: auto;
        font-size: 12px;
        color: #999;
      }

      /* ─── Inbox Thread List ─── */
      .content {
        overflow-y: auto;
        padding: 0;
        scrollbar-width: thin;
      }
      .content-inner {
        max-width: 780px;
        margin: 0 auto;
        padding: 20px 32px;
      }
      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        padding: 0 4px;
      }
      .content-header h2 {
        font-size: 18px;
        font-weight: 700;
      }
      .content-header .sub {
        font-size: 13px;
        color: #888;
      }
      .filter-bar {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        border-bottom: 1px solid #eee;
        padding-bottom: 0;
      }
      .filter-bar button {
        padding: 8px 14px;
        border: none;
        background: transparent;
        font-size: 13px;
        cursor: pointer;
        color: #777;
        font-weight: 500;
        border-bottom: 2px solid transparent;
        transition: 0.15s;
        margin-bottom: -1px;
        font-family: inherit;
      }
      .filter-bar button:hover {
        color: #333;
      }
      .filter-bar button.active {
        color: #0066ff;
        border-bottom-color: #0066ff;
      }

      /* ─── Thread Row ─── */
      .thread-row {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        padding: 14px 16px;
        cursor: pointer;
        transition: 0.1s;
        border-radius: 8px;
        align-items: start;
        margin-bottom: 2px;
        position: relative;
      }
      .thread-row:hover {
        background: #f5f5f5;
      }
      .thread-row.unread {
        background: #f8fbff;
      }
      .thread-row.unread:hover {
        background: #f0f5ff;
      }
      .thread-row.selected {
        background: #e8f0fe;
      }
      .thread-row.selected .thread-subject {
        color: #0066ff;
      }
      .thread-av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .thread-body {
        min-width: 0;
      }
      .thread-from {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 1px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .thread.unread .thread-from {
        font-weight: 700;
      }
      .thread-from .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 3px;
        font-weight: 500;
      }
      .thread-from .badge.ai {
        background: #eef2ff;
        color: #4f46e5;
      }
      .thread-from .badge.urgent {
        background: #fef2f2;
        color: #dc2626;
      }
      .thread-subject {
        font-size: 14px;
        font-weight: 500;
        color: #333;
        margin-bottom: 1px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thread-snippet {
        font-size: 13px;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }
      .thread-meta {
        text-align: right;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }
      .thread-date {
        font-size: 12px;
        color: #999;
      }
      .thread-att {
        font-size: 12px;
        color: #bbb;
      }
      .thread-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0066ff;
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%);
      }

      /* ─── Thread Detail View ─── */
      .thread-detail {
        display: none;
        height: 100%;
        overflow-y: auto;
        background: #fff;
        scrollbar-width: thin;
      }
      .thread-detail.active {
        display: block;
      }
      .detail-header {
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 5;
        border-bottom: 1px solid #eee;
        padding: 0 32px;
      }
      .detail-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .detail-nav button {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #666;
        padding: 6px 10px;
        border-radius: 6px;
        transition: 0.15s;
        font-family: inherit;
      }
      .detail-nav button:hover {
        background: #f5f5f5;
        color: #333;
      }
      .detail-nav .nav-right {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .detail-nav .nav-right button {
        color: #999;
        font-size: 11px;
      }
      .detail-subject {
        padding: 20px 0 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
      }
      .detail-actions {
        display: flex;
        gap: 6px;
        padding: 14px 0 16px;
        border-bottom: 1px solid #eee;
      }
      .detail-actions .btn {
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 6px;
      }
      .detail-actions .btn-archive {
        background: transparent;
        border: 1px solid #ddd;
        color: #555;
      }
      .detail-actions .btn-archive:hover {
        background: #f5f5f5;
      }
      .detail-body {
        padding: 24px 32px 40px;
        max-width: 720px;
      }
      .detail-from {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }
      .detail-av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }
      .detail-from-info {
        min-width: 0;
      }
      .detail-from-name {
        font-size: 15px;
        font-weight: 600;
      }
      .detail-from-email {
        font-size: 13px;
        color: #888;
        margin-bottom: 1px;
      }
      .detail-from-date {
        font-size: 12px;
        color: #aaa;
      }
      .detail-text {
        font-size: 15px;
        line-height: 1.7;
        color: #2a2a2a;
      }
      .detail-text p {
        margin-bottom: 14px;
      }
      .detail-text .quote {
        border-left: 3px solid #ddd;
        padding-left: 14px;
        color: #888;
        margin: 16px 0;
      }
      .detail-text .sig {
        color: #999;
        font-size: 13px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #eee;
      }

      /* ─── Empty / Loading ─── */
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #999;
      }
      .empty-state .icon {
        font-size: 56px;
        margin-bottom: 12px;
      }
      .empty-state h3 {
        font-size: 18px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
      }
      .loading {
        text-align: center;
        padding: 60px 20px;
        color: #aaa;
        font-size: 13px;
      }

      /* ─── Pagination ─── */
      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        padding: 12px 4px 0;
        border-top: 1px solid #eee;
      }
      .pagination button {
        padding: 7px 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        transition: 0.15s;
        font-family: inherit;
      }
      .pagination button:hover {
        background: #f5f5f5;
      }
      .pagination button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pagination-label {
        font-size: 12px;
        color: #999;
      }

      /* ─── Mobile ─── */
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: 56px auto;
        }
        .sidebar {
          display: none;
        }
        .layout.show-sidebar .sidebar {
          display: flex;
          position: fixed;
          inset: 56px 0 0 0;
          z-index: 20;
        }
        .layout.show-sidebar .content {
          display: none;
        }
        .content-inner {
          padding: 12px 14px;
        }
        .detail-header {
          padding: 0 14px;
        }
        .detail-body {
          padding: 16px 14px;
        }
        .detail-nav {
          padding: 8px 0;
        }
        .header {
          padding: 0 14px;
        }
        .header-nav {
          display: none;
        }
      }

      /* ─── Animations ─── */
      .slide-in {
        animation: slideIn 0.2s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ─── Compose overlay ─── */
      .compose-overlay {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 480px;
        max-width: calc(100vw - 48px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        z-index: 50;
        display: none;
        overflow: hidden;
      }
      .compose-overlay.open {
        display: block;
      }
      .compose-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid #eee;
        background: #fafafa;
      }
      .compose-head h3 {
        font-size: 14px;
        font-weight: 600;
      }
      .compose-head button {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #999;
        padding: 2px;
      }
      .compose-body {
        padding: 14px 18px;
      }
      .compose-body input {
        width: 100%;
        padding: 8px 0;
        border: none;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        border-bottom: 1px solid #eee;
      }
      .compose-body textarea {
        width: 100%;
        padding: 8px 0;
        border: none;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        resize: none;
        min-height: 120px;
        margin-top: 8px;
      }
      .compose-foot {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 12px 18px;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div class="layout" id="layout">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <div class="header-logo" onclick="showInbox()">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.58a2 2 0 0 1-2.06 0L2 7" />
            </svg>
            Inbox Zero
          </div>
          <div class="header-nav">
            <span class="active">Inbox</span>
            <span>Sent</span>
            <span>Drafts</span>
            <span>Archive</span>
          </div>
        </div>
        <div class="header-right">
          <span style="font-size:12px;color:rgba(255,255,255,.6)"
            >demo@inboxzero.app</span
          >
          <span class="status-badge">DEMO</span>
          <div class="avatar">D</div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-scroll">
          <div class="sidebar-count">UNREAD</div>
          <div class="sidebar-unread" id="unreadCount">42</div>
          <div class="sidebar-actions">
            <button class="btn btn-primary" id="refreshBtn" onclick="refresh()">
              ↻ Refresh
            </button>
            <button class="btn btn-secondary" onclick="toggleCompose()">
              ✏ Compose
            </button>
          </div>
          <div class="search-wrap">
            <span class="si">🔍</span>
            <input
              id="searchIn"
              placeholder="Search inbox..."
              oninput="debouncedSearch()"
            />
          </div>
          <div class="sidebar-categories">
            <div class="sidebar-cat active" onclick="setFolder('inbox')">
              📥 Inbox <span class="count" id="catInbox">42</span>
            </div>
            <div class="sidebar-cat" onclick="setFolder('flagged')">
              ★ Flagged <span class="count" id="catFlagged">0</span>
            </div>
            <div class="sidebar-cat" onclick="setFolder('snoozed')">
              ⏰ Snoozed <span class="count" id="catSnoozed">0</span>
            </div>
            <div class="sidebar-cat" onclick="setFolder('done')">
              ✅ Done <span class="count" id="catDone">0</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Inbox Content -->
      <div class="content" id="inboxView">
        <div class="content-inner">
          <div class="content-header">
            <div>
              <h2 id="inboxTitle">Inbox</h2>
              <span class="sub" id="inboxSub"></span>
            </div>
          </div>
          <div class="filter-bar" id="filterBar">
            <button class="active" onclick="setFilter('all')">All</button>
            <button onclick="setFilter('unread')">Unread</button>
            <button onclick="setFilter('attachments')">Has Files</button>
          </div>
          <div id="threadList"></div>
          <div class="pagination" id="pagination">
            <button id="prevBtn" onclick="prevPage()">← Previous</button>
            <span class="pagination-label" id="pageLabel"></span>
            <button id="nextBtn" onclick="nextPage()">Next →</button>
          </div>
        </div>
      </div>

      <!-- Thread Detail -->
      <div class="thread-detail" id="threadDetail">
        <div class="detail-header" id="detailHeader"></div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </div>

    <!-- Compose -->
    <div class="compose-overlay" id="composeOverlay">
      <div class="compose-head">
        <h3>New Message</h3>
        <button onclick="toggleCompose()">✕</button>
      </div>
      <div class="compose-body">
        <input placeholder="To" id="composeTo" /><br />
        <input placeholder="Subject" id="composeSub" /><br />
        <textarea
          placeholder="Write your message..."
          id="composeBody"
        ></textarea>
      </div>
      <div class="compose-foot">
        <button class="btn btn-secondary" onclick="toggleCompose()">
          Discard
        </button>
        <button class="btn btn-primary" onclick="sendCompose()">Send →</button>
      </div>
    </div>

    <script>
      // ─── Mock Data ──────────────────────────────────────────────
      const SENDERS = [
        ["Stripe", "#635bff"],
        ["Notion", "#000000"],
        ["Slack", "#4a154b"],
        ["Linear", "#5e6ad2"],
        ["Vercel", "#000000"],
        ["GitHub", "#24292f"],
        ["Figma", "#f24e1e"],
        ["Calendly", "#006bff"],
        ["Loom", "#625aff"],
        ["Intercom", "#1f8ded"],
        ["Arc Browser", "#fcbf49"],
        ["Posthog", "#000000"],
        ["David (Personal)", "#16a34a"],
        ["Kate Chen", "#db2777"],
        ["Marcus Webb", "#7c3aed"],
        ["Jenny Tran", "#0891b2"],
        ["Amit Patel", "#ea580c"],
        ["Sarah Kim", "#dc2626"],
        ["Tom Adams", "#2563eb"],
        ["Rachel Lee", "#9333ea"],
        ["James O'Brien", "#059669"],
        ["Nina Eriksson", "#d946ef"],
        ["Liam Scott", "#0284c7"],
        ["Zoe Williams", "#b45309"],
        ["Elena Popescu", "#0891b2"],
        ["Hugo Chang", "#ca8a04"],
        ["Priya Sharma", "#dc2626"],
        ["Miguel Torres", "#4f46e5"],
        ["Alice Foster", "#0d9488"],
        ["Sam Wilson", "#1d4ed8"]
      ];

      function msg(id, from, to, sub, body) {
        return { id, from, to, subject: sub, body };
      }

      const FULL_EMAILS = [
        // 0
        msg(
          0,
          "Stripe",
          "david@platelogic.ie",
          "Your weekly invoice is ready",
          `Hi David,\n\nYour latest Stripe invoice for £247.50 is now available.\n\nSummary:\n  • Processing fees: £32.40\n  • Subscription (Pro): £199.00\n  • Add-ons: £16.10\n\nDue date: May 5, 2026\n\nView invoice → https://dashboard.stripe.com/invoices\n\nThanks,\nStripe Billing Team`
        ),
        // 1
        msg(
          1,
          "Notion",

      function buildThread(fullEmail, i) {
        const fromName = fullEmail.from;
        const sender = SENDERS.find(s => s[0] === fromName) || [
          fromName,
          "#666"
        ];
        const isUnread = Math.random() < 0.35;
        const daysAgo = Math.floor(Math.random() * 14);
        const date = new Date(
          Date.now() - daysAgo * 86400000 - Math.floor(Math.random() * 86400000)
        );
        const flag = !isUnread && Math.random() < 0.12;
        const hasAtt = Math.random() < 0.15;
        const aiLabels = [
          "Needs reply",
          "Action required",
          "Meeting",
          "Invoice",
          "Newsletter",
          "Customer",
          "Review needed",
          "Follow up",
          "Support",
          "Urgent"
        ];
        const ai =
          Math.random() < 0.35
            ? aiLabels[Math.floor(Math.random() * aiLabels.length)]
            : null;

        return {
          id: fullEmail.id,
          from: fullEmail.from,
          fromEmail: fullEmail.to,
          subject: fullEmail.subject,
          snippet: fullEmail.body
            .split("\n")
            .slice(0, 2)
            .join(" ")
            .substring(0, 120),
          body: fullEmail.body,
          date: date.getTime(),
          unread: isUnread,
          flagged: flag,
          hasAttachments: hasAtt,
          aiLabel: ai,
          avatarColor: sender[1]
        };
      }

      const ALL = FULL_EMAILS.map(buildThread);

      // ─── State ──────────────────────────────────────────────────
      let currentPage = 1;
      let currentFilter = "all";
      let currentFolder = "inbox";
      let currentSearch = "";
      let selectedThreadId = null;
      const PER_PAGE = 12;
      let debounceTimer = null;
      let historyStack = [];

      function getActive() {
        let items = [...ALL];
        if (currentFolder === "flagged") items = items.filter(t => t.flagged);
        if (currentFolder === "snoozed") items = items.filter(t => false); // empty mock
        if (currentFolder === "done") items = items.filter(t => false); // empty mock
        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          items = items.filter(
            t =>
              t.from.toLowerCase().includes(q) ||
              t.subject.toLowerCase().includes(q) ||
              t.snippet.toLowerCase().includes(q)
          );
        }
        if (currentFilter === "unread") items = items.filter(t => t.unread);
        if (currentFilter === "attachments")
          items = items.filter(t => t.hasAttachments);
        return items;
      }

      // ─── Render Inbox ───────────────────────────────────────────
      function renderInbox() {
        const items = getActive();
        const total = items.length;
        const totalPages = Math.ceil(total / PER_PAGE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * PER_PAGE;
        const pageItems = items.slice(start, start + PER_PAGE);

        const unreadCount = ALL.filter(
          t => t.unread && currentFolder === "inbox"
        ).length;

        // Update sidebar counts
        document.getElementById("unreadCount").textContent = unreadCount;
        document.getElementById("catInbox").textContent = unreadCount;
        document.getElementById("catFlagged").textContent = ALL.filter(
          t => t.flagged
        ).length;
        document.getElementById("catSnoozed").textContent = "0";
        document.getElementById("catDone").textContent = "0";

        // Update sidebar folder selection
        document.querySelectorAll(".sidebar-cat").forEach(el => {
          el.classList.toggle(
            "active",
            el.textContent
              .trim()
              .toLowerCase()
              .includes(currentFolder)
          );
        });

        // Filter bar buttons
        document.querySelectorAll(".filter-bar button").forEach(b => {
          const val = b.textContent.toLowerCase();
          const map = {
            all: "all",
            unread: "unread",
            "has files": "attachments"
          };
          b.classList.toggle("active", (map[val] || val) === currentFilter);
        });

        const container = document.getElementById("threadList");

        if (pageItems.length === 0) {
          container.innerHTML = `<div class="empty-state slide-in"><div class="icon">🎉</div><h3>Inbox Zero!</h3><p>${
            currentSearch ? "No results for that search" : "All caught up"
          }</p></div>`;
          document.getElementById("pagination").style.display = "none";
          document.getElementById("inboxTitle").textContent = currentSearch
            ? `Search: "${currentSearch}"`
            : currentFolder === "flagged"
            ? "Flagged"
            : currentFolder === "snoozed"
            ? "Snoozed"
            : currentFolder === "done"
            ? "Done"
            : "Inbox";
          document.getElementById("inboxSub").textContent = "";
          return;
        }

        document.getElementById("pagination").style.display = "flex";
        document.getElementById("inboxTitle").textContent = currentSearch
          ? `Search: "${currentSearch}"`
          : currentFolder === "flagged"
          ? "Flagged"
          : currentFolder === "snoozed"
          ? "Snoozed"
          : currentFolder === "done"
          ? "Done"
          : "Inbox";
        document.getElementById(
          "inboxSub"
        ).textContent = `${total} conversations`;

        container.innerHTML =
          '<div class="slide-in">' +
          pageItems
            .map(t => {
              const initials = t.from
                .split(" ")
                .map(w => w[0])
                .join("")
                .substring(0, 2)
                .toUpperCase();
              const isRecent = Date.now() - t.date < 86400000 * 2;
              const dateStr = isRecent
                ? new Date(t.date).toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                  })
                : new Date(t.date).toLocaleDateString([], {
                    month: "short",
                    day: "numeric"
                  });
              const sel = t.id === selectedThreadId;

              return `<div class="thread-row ${t.unread ? "unread" : ""} ${
                sel ? "selected" : ""
              }" onclick="openThread(${t.id})" data-id="${t.id}">
      <div class="thread-av" style="background:${
        t.avatarColor
      }">${initials}</div>
      <div class="thread-body">
        <div class="thread-from">
          ${t.from}
          ${t.aiLabel ? `<span class="badge ai">${t.aiLabel}</span>` : ""}
          ${
            t.subject.toLowerCase().includes("security") ||
            t.subject.toLowerCase().includes("urgent")
              ? '<span class="badge urgent">!</span>'
              : ""
          }
        </div>
        <div class="thread-subject">${t.subject}</div>
        <div class="thread-snippet">${t.snippet}</div>
      </div>
      <div class="thread-meta">
        <div class="thread-date">${dateStr}</div>
        ${t.hasAttachments ? '<div class="thread-att">📎</div>' : ""}
        ${t.flagged ? '<div style="color:#ea580c;font-size:12px">★</div>' : ""}
        ${t.unread ? '<div class="thread-dot"></div>' : ""}
      </div>
    </div>`;
            })
            .join("") +
          "</div>";

        document.getElementById(
          "pageLabel"
        ).textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById("prevBtn").disabled = currentPage <= 1;
        document.getElementById("nextBtn").disabled = currentPage >= totalPages;
      }

      // ─── Open Thread ────────────────────────────────────────────
      function openThread(id) {
        const t = ALL.find(x => x.id === id);
        if (!t) return;

        // Mark as read
        t.unread = false;

        // Switch to thread view (sidebar collapse)
        document.getElementById("layout").classList.add("thread-open");
        document.getElementById("inboxView").style.display = "none";
        document.getElementById("threadDetail").classList.add("active");

        // Push to history
        historyStack.push("inbox");

        // Sender info
        const sender = SENDERS.find(s => s[0] === t.from) || [t.from, "#666"];
        const initials = t.from
          .split(" ")
          .map(w => w[0])
          .join("")
          .substring(0, 2)
          .toUpperCase();
        const fullDate = new Date(t.date).toLocaleDateString([], {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });

        // Params
        const total = getActive().length;
        const idx = ALL.indexOf(t);
        const hasPrev = idx > 0;
        const hasNext = idx < ALL.length - 1;

        // Render detail header
        document.getElementById("detailHeader").innerHTML = `
    <div class="detail-nav">
      <button onclick="showInbox()">← Back to Inbox</button>
      <div class="nav-right">
        <button onclick="openThread(${
          ALL[(idx - 1 + ALL.length) % ALL.length].id
        })" ${!hasPrev ? "disabled" : ""}>← Prev</button>
        <button onclick="openThread(${ALL[(idx + 1) % ALL.length].id})" ${
          !hasNext ? "disabled" : ""
        }>Next →</button>
      </div>
    </div>
    <div class="detail-subject">${t.subject}</div>
    <div class="detail-actions">
      <button class="btn btn-primary" onclick="composeReply('${
        t.from
      }','${t.subject.replace(/'/g, "\\'")}')">✉ Reply</button>
      <button class="btn btn-archive" onclick="archiveThread(${
        t.id
      })">📁 Archive</button>
      <button class="btn btn-archive" onclick="showInbox()">⏰ Snooze</button>
      <button class="btn btn-archive" onclick="toggleFlag(${
        t.id
      });renderInbox()">${t.flagged ? "★ Unflag" : "☆ Flag"}</button>
    </div>
  `;

        // Build body content
        const bodyLines = t.body.split("\n");
        let bodyHtml = '<div class="slide-in">';
        bodyHtml += `<div class="detail-from">
    <div class="detail-av" style="background:${t.avatarColor}">${initials}</div>
    <div class="detail-from-info">
      <div class="detail-from-name">${t.from}</div>
      <div class="detail-from-email">${t.fromEmail}</div>
      <div class="detail-from-date">${fullDate}</div>
    </div>
  </div>`;

        bodyHtml += '<div class="detail-text">';
        let inQuote = false;

        for (const line of bodyLines) {
          const trimmed = line.trim();
          if (
            trimmed.startsWith(">") ||
            (trimmed.startsWith("On ") && trimmed.includes("wrote:"))
          ) {
            if (!inQuote) {
              bodyHtml += '<div class="quote">';
              inQuote = true;
            }
            bodyHtml += trimmed + "<br>";
            continue;
          }
          if (inQuote) {
            bodyHtml += "</div>";
            inQuote = false;
          }

          if (!trimmed) {
            bodyHtml += "<br>";
            continue;
          }
          if (trimmed.startsWith("•") || trimmed.startsWith("  •")) {
            bodyHtml += trimmed + "<br>";
          } else if (trimmed.startsWith("─")) {
            bodyHtml +=
              '<div style="color:#ccc;font-size:11px;margin:8px 0">' +
              trimmed +
              "</div>";
          } else if (
            trimmed.startsWith("✅") ||
            trimmed.startsWith("❌") ||
            trimmed.startsWith("⏳")
          ) {
            bodyHtml += '<div style="margin:2px 0">' + trimmed + "</div>";
          } else if (trimmed.startsWith("http")) {
            bodyHtml +=
              '<a href="' +
              trimmed +
              '" style="color:#0066ff;word-break:break-all">' +
              trimmed +
              "</a><br>";
          } else if (trimmed.startsWith("—")) {
            bodyHtml +=
              '<div class="sig">— ' + trimmed.substring(1).trim() + "</div>";
          } else {
            bodyHtml += "<p>" + trimmed + "</p>";
          }
        }
        if (inQuote) bodyHtml += "</div>";
        bodyHtml += "</div></div>";

        document.getElementById("detailBody").innerHTML = bodyHtml;
        document.getElementById("detailBody").scrollTop = 0;

        // Update hash
        window.location.hash = "thread/" + t.id;
      }

      function showInbox() {
        document.getElementById("layout").classList.remove("thread-open");
        document.getElementById("threadDetail").classList.remove("active");
        document.getElementById("inboxView").style.display = "block";
        renderInbox();
        historyStack = [];
        window.location.hash = "";
      }

      // ─── Actions ────────────────────────────────────────────────
      function archiveThread(id) {
        const t = ALL.find(x => x.id === id);
        if (t) t.flagged = false;
        showInbox();
      }

      function toggleFlag(id) {
        const t = ALL.find(x => x.id === id);
        if (t) t.flagged = !t.flagged;
        renderInbox();
      }

      function composeReply(to, sub) {
        document.getElementById("composeTo").value = to;
        document.getElementById("composeSub").value = "Re: " + sub;
        document.getElementById("composeBody").value = "";
        document.getElementById("composeOverlay").classList.add("open");
      }

      function toggleCompose() {
        document.getElementById("composeOverlay").classList.toggle("open");
      }

      function sendCompose() {
        document.getElementById("composeOverlay").classList.remove("open");
        // Just add a fake dopamine hit
        const btn = document.querySelector(".sidebar-actions .btn-primary");
        const orig = btn.innerHTML;
        btn.innerHTML = "✉ Sent!";
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.disabled = false;
        }, 1000);
      }

      function refresh() {
        const btn = document.getElementById("refreshBtn");
        btn.innerHTML = "↻ Syncing...";
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = "↻ Refresh";
          btn.disabled = false;
          renderInbox();
        }, 800);
      }

      function setFolder(f) {
        currentFolder = f;
        currentPage = 1;
        currentSearch = "";
        document.getElementById("searchIn").value = "";
        renderInbox();
      }
      function setFilter(f) {
        currentFilter = f;
        currentPage = 1;
        renderInbox();
      }
      function prevPage() {
        if (currentPage > 1) {
          currentPage--;
          renderInbox();
        }
      }
      function nextPage() {
        const tp = Math.ceil(getActive().length / PER_PAGE);
        if (currentPage < tp) {
          currentPage++;
          renderInbox();
        }
      }
      function debouncedSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          currentSearch = document.getElementById("searchIn").value;
          currentPage = 1;
          renderInbox();
        }, 200);
      }

      // ─── Handle hash navigation ─────────────────────────────────
      window.addEventListener("hashchange", () => {
        if (window.location.hash.startsWith("#thread/")) {
          const id = parseInt(window.location.hash.split("/")[1]);
          if (!isNaN(id)) openThread(id);
        } else {
          showInbox();
        }
      });

      // ─── Keyboard shortcuts ─────────────────────────────────────
      document.addEventListener("keydown", e => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")
          return;
        if (e.key === "Escape") {
          if (
            document.getElementById("composeOverlay").classList.contains("open")
          ) {
            toggleCompose();
            return;
          }
          showInbox();
        }
        if (e.key === "n" || e.key === "N") toggleCompose();
        if (e.key === "r" || e.key === "R") refresh();
      });

      // ─── Init ───────────────────────────────────────────────────
      renderInbox();
    </script>
  </body>
</html>
